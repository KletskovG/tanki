name: Client build and deploy

on:
  push:
    branches:
      - "**"
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Java for the AS3 compiler
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build TypeScript, AS3, and Ruffle assets
        run: npm run build

      - name: Save static assets
        uses: actions/upload-artifact@v6
        with:
          name: client-dist
          path: client/dist/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_PAGER: ""
      S3_BUCKET: ${{ vars.YC_S3_BUCKET }}
    steps:
      - name: Download static assets
        uses: actions/download-artifact@v7
        with:
          name: client-dist
          path: client/dist/

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Set the YC_ACCESS_KEY_ID repository secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Set the YC_SECRET_ACCESS_KEY repository secret}"
          : "${S3_BUCKET:?Set the YC_S3_BUCKET repository variable to a bucket name}"
          if [[ ! "$S3_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "YC_S3_BUCKET must be a bucket name, without s3:// or a path." >&2
            exit 1
          fi
          aws --version

      - name: Upload assets to Yandex Object Storage
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync client/dist/ "s3://${S3_BUCKET}/" \
            --endpoint-url=https://storage.yandexcloud.net \
            --cache-control no-cache \
            --delete \
            --only-show-errors

          # Ensure WebAssembly has the MIME type required for streaming compilation.
          for asset in client/dist/*.wasm; do
            aws s3 cp "$asset" "s3://${S3_BUCKET}/$(basename "$asset")" \
              --endpoint-url=https://storage.yandexcloud.net \
              --content-type application/wasm \
              --cache-control no-cache \
              --only-show-errors
          done
