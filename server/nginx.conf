server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/51.250.87.166/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/51.250.87.166/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
